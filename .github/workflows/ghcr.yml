name: Build platform-api (GHCR)

# Why this exists alongside deploy.yml, rather than editing it:
#
#   • deploy.yml pushes to DOCKER HUB as `<user>/platform-api:latest`, and it
#     runs under `environment: dev-deploy` whose secrets are the Docker Hub
#     credentials. Provisioned installs pull from GHCR, so that pipeline cannot
#     feed them at all.
#   • It also triggers only on refat/test-2026.
#
# This one needs no secrets beyond GITHUB_TOKEN and touches nothing Docker Hub
# publishes, so the two cannot interfere.

on:
  push:
    branches:
      - rajat/test-2026
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Deliberately NO `environment:` — dev-deploy may be approval-gated, and
    # everything here is available to any push on this branch.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: t
        run: |
          echo "slug=${GITHUB_REF_NAME//\//-}"       >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}"            >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}"  >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          # REQUIRED, not a preference. `az acr import` cannot copy buildx's
          # default provenance/SBOM attestations: they land in the OCI index as
          # an `unknown/unknown` manifest and the import fails with "Error
          # copying blobs" — after the ARM deployment has already succeeded, so
          # the install comes up on the placeholder image with no obvious cause.
          provenance: false
          sbom: false
          # Never `:latest`. The branch slug and the commit sha are both
          # traceable to a build; `:latest` is neither, and something else may
          # already be pulling it.
          tags: |
            ghcr.io/${{ steps.t.outputs.owner }}/platform-api:${{ steps.t.outputs.slug }}
            ghcr.io/${{ steps.t.outputs.owner }}/platform-api:${{ steps.t.outputs.sha }}
          cache-from: type=gha,scope=platform-api
          cache-to: type=gha,scope=platform-api,mode=max

      - name: Summary
        run: |
          {
            echo "### platform-api"
            echo '```'
            echo "ghcr.io/${{ steps.t.outputs.owner }}/platform-api:${{ steps.t.outputs.slug }}"
            echo "ghcr.io/${{ steps.t.outputs.owner }}/platform-api:${{ steps.t.outputs.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
