name: Build and Push to Docker Hub

on:
  push:
    branches:
      - Ashutosh/prod-2026

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev-deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/platform-api-prod:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/platform-api-prod:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure and restart platform-api-bian-keyVault
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config container set \
              --resource-group Common_Services \
              --name platform-api-bian-keyVault \
              --docker-custom-image-name ${{ secrets.DOCKERHUB_USERNAME }}/platform-api-prod:latest \
              --docker-registry-server-url https://index.docker.io \
              --docker-registry-server-user ${{ secrets.DOCKERHUB_USERNAME }} \
              --docker-registry-server-password ${{ secrets.DOCKERHUB_TOKEN }}
            az webapp restart --resource-group Common_Services --name platform-api-bian-keyVault
